<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRADE PAGE</title>
    <script>
        // Initialize the grades array from localStorage (or empty array if none exists)
        let grades = JSON.parse(localStorage.getItem("grades")) || [];

        // Run showGrades as soon as the page loads to display any saved records
        window.onload = function() {
            showGrades();
        };

        function showGrades() {
            const tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = ""; // Clear existing rows

            for (let i = 0; i < grades.length; i++) {
                let row = tableBody.insertRow();
                row.insertCell().textContent = grades[i].lrn;
                row.insertCell().textContent = grades[i].name;
                row.insertCell().textContent = grades[i].subject;
                row.insertCell().textContent = grades[i].grade;
            }
        }

        function saveGrade(event) {
            event.preventDefault(); // Stop page from refreshing on form submit

            const lrn = document.getElementById("lrn").value.trim();
            const name = document.getElementById("name").value.trim();
            const subject = document.getElementById("subject").value.trim();
            const grade = document.getElementById("grades").value.trim();
            const message = document.getElementById("message");

            if (lrn === "" || name === "" || subject === "" || grade === "") {
                message.textContent = "Complete the Form to proceed.";
                return;
            }

            message.textContent = ""; // Clear any error messages

            // Create record object and push to array
            const record = { lrn: lrn, name: name, subject: subject, grade: grade };
            grades.push(record);

            // Save updated array to localStorage
            localStorage.setItem("grades", JSON.stringify(grades));

            // Refresh the table display and clear the form inputs
            showGrades();
            document.getElementById("studentForm").reset();
        }
    </script>
</head>
<body>
    <form id="studentForm" onsubmit="saveGrade(event)"> 
        <div>
            <label for="lrn">LRN:</label>
            <input type="text" id="lrn" name="lrn" placeholder="Enter LRN">
        </div>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter name">
        </div>
        <div>
            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" placeholder="Enter subject">
        </div>
        <div>
            <label for="grades">Grade:</label>
            <input type="number" id="grades" name="grades" placeholder="Enter Grade" min="0" max="100">
        </div>

        <button type="submit" id="submitForm">Save</button>
        <p id="message" style="color: red;"></p>
    </form>

    <br>

    <!-- Table to display the saved records -->
    <table border="1" id="gradeTable">
        <thead>
            <tr>
                <th>LRN</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Rows will be inserted here dynamically -->
        </tbody>
    </table>
</body>
</html>
