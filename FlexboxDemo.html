<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Demo</title>

    <style>
        /* The Flexbox container */
        .container {
            display: flex;

            /* Alignment */
            justify-content: center;
            align-items: center;

            /* Direction */
            flex-direction:row;

            /* Wrapping */
            flex-wrap: wrap;

            /* Space between items */
            gap: 10px;

            width: 80%;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid black;
        }

        /* The Flexbox items */
        .box {
            flex: 1;
            min-width: 100px;
            padding: 30px;
            text-align: center;
            background-color: lightblue;
            border: 2px solid navy;
        }
    </style>
</head>

<body>

    <h1>Flexbox Demo</h1>

    <div class="container">
        <div class="box">One</div>
        <div class="box">Two</div>
        <div class="box">Three</div>
        <div class="box">Four</div>
        <div class="box">Five</div>
        <div class="box">Six</div>
    </div>

</body>
</html>
